<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAND MANAGER</title>
  <meta name="description" content="밴드 운영 및 공연 기획 플랫폼">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Michroma&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 물결(Ripple) 텍스트 필터 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="ripple" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ripple-sm" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.06" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ripple-xs" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.09" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <header class="top">
    <a href="#/home" class="brand" aria-label="Band Manager 홈">
      <span class="brand-tech">BAND</span><span class="brand-wave">Manager</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/home" data-r="home">Home</a>
      <a href="#/bands" data-r="bands">My Bands</a>
      <a href="#/studio" data-r="studio">Studio</a>
      <a href="#/setlist" data-r="setlist">Setlist</a>
      <a href="#/rehearsal" data-r="rehearsal">Rehearsal</a>
      <a href="#/progress" data-r="progress">Progress</a>
      <a href="#/festivals" data-r="festivals">Festival</a>
      <a href="#/timetable" data-r="timetable">Timetable</a>
      <a href="#/personal" data-r="personal">Personal</a>
    </nav>
    <div class="top-right">
      <label class="band-switch">
        <span class="lbl">active band</span>
        <select id="activeBand"></select>
      </label>
      <a href="#/account" class="account-btn" id="accountBtn" hidden></a>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <span class="lbl">a project by</span> <b class="tech">BAND MANAGER</b>
    <span class="lbl right"><span id="saveInfo">data saved in this browser</span> · <a href="#" id="resetData">reset demo</a></span>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/views-band.js"></script>
  <script src="js/views-festival.js"></script>
  <script src="js/views-account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
