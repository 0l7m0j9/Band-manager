<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAND MANAGER</title>
  <meta name="description" content="학교 밴드 운영 · 합주 · 연습실 · 공연 기획 플랫폼">
  <meta name="theme-color" content="#f6f4ef">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 화면은 Pretendard 하나만 씀. 아래 글꼴들은 포스터(Canvas) 디자인용 -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Michroma&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <header class="top">
    <a href="#/home" class="brand" aria-label="Band Manager 홈">
      <span class="brand-tech">BAND</span><span class="brand-wave">Manager</span>
    </a>
    <!-- 메뉴는 계급(관리자·단장·부원)에 따라 app.js 가 채움 -->
    <nav class="nav" id="nav"></nav>
    <div class="top-right">
      <label class="band-switch" id="groupSwitch" hidden>
        <span class="lbl">group</span>
        <select id="groupSel"></select>
      </label>
      <a href="#/account" class="account-btn" id="accountBtn" hidden></a>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <span class="lbl">a project by</span> <b class="tech">BAND MANAGER</b>
    <span class="lbl right"><span id="saveInfo"></span></span>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/views-band.js"></script>
  <script src="js/views-festival.js"></script>
  <script src="js/views-calendar.js"></script>
  <script src="js/views-home.js"></script>
  <script src="js/views-rooms.js"></script>
  <script src="js/views-board.js"></script>
  <script src="js/sheet-export.js"></script>
  <script src="js/views-members.js"></script>
  <script src="js/views-account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
